<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>ScantyMeals POS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/scanty-theme.css">
  <style>
    .pos-topbar { background: #641D28; color: #fff; padding: 14px 0; }
    .pos-topbar .scanty-shell { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .pos-brand { font-family: 'Playfair Display', Georgia, serif; font-weight: 800; font-size: 20px; color: #fff; }
    .meal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
    .meal-tile { background: #fff; border: 1px solid #efe7db; border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform .15s, box-shadow .15s; text-align: left; }
    .meal-tile:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(100,29,40,.14); }
    .meal-tile img { width: 100%; height: 110px; object-fit: cover; display: block; }
    .meal-tile .tile-body { padding: 10px 12px; }
    .meal-tile .tile-name { font-weight: 600; font-size: 14px; color: #292522; }
    .meal-tile .tile-price { color: #39845B; font-weight: 700; }
    .cart-line { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #efe7db; }
    .cart-line .qty-btn { width: 28px; height: 28px; border: 1px solid #e7ddd0; background: #fff; border-radius: 6px; cursor: pointer; font-weight: 700; color: #292522; }
    .totals { border-top: 2px solid #efe7db; margin-top: 8px; padding-top: 12px; }
    .section-head { font-weight: 700; color: #292522; font-size: 15px; margin: 0 0 12px; }
    .view { display: none; }
    .view.active { display: block; }

    /* Receipt + print */
    #receiptModal { display: none; position: fixed; inset: 0; background: rgba(41,37,34,.55); z-index: 400; align-items: center; justify-content: center; padding: 20px; }
    #receiptModal.open { display: flex; }
    #receipt { background: #fff; width: 100%; max-width: 360px; border-radius: 12px; padding: 24px; }
    #receipt .r-head { text-align: center; border-bottom: 1px dashed #ddd; padding-bottom: 12px; margin-bottom: 12px; }
    #receipt .r-line { display: flex; justify-content: space-between; font-size: 14px; padding: 3px 0; color: #292522; }
    #receipt .r-total { display: flex; justify-content: space-between; font-weight: 800; font-size: 16px; border-top: 1px dashed #ddd; margin-top: 10px; padding-top: 10px; }
    @media print {
      body * { visibility: hidden; }
      #receipt, #receipt * { visibility: visible; }
      #receipt { position: absolute; left: 0; top: 0; width: 100%; max-width: 100%; box-shadow: none; border-radius: 0; }
    }
  </style>
</head>
<body>

<header class="pos-topbar">
  <div class="scanty-shell">
    <span class="pos-brand">ScantyMeals POS</span>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <span id="roleBadge" class="scanty-badge scanty-badge--role" style="background:rgba(255,255,255,.18);color:#fff">…</span>
      <button class="scanty-btn scanty-btn--ghost" style="color:#fff;border-color:rgba(255,255,255,.4)" onclick="showView('sales');loadMySales()">My Sales</button>
      <button class="scanty-btn scanty-btn--ghost" style="color:#fff;border-color:rgba(255,255,255,.4)" onclick="showView('pos')">New Sale</button>
      <button class="scanty-btn scanty-btn--ghost" style="color:#fff;border-color:rgba(255,255,255,.4)" onclick="logout()">Logout</button>
    </div>
  </div>
</header>

<main class="scanty-shell" style="padding:24px 0 48px">

  <!-- ===== POS VIEW ===== -->
  <div id="posView" class="view active">
    <div class="grid" style="display:grid;grid-template-columns:1fr;gap:20px">
      <div>
        <h2 class="section-head">Menu</h2>
        <div id="mealGrid" class="meal-grid">Loading…</div>
      </div>
      <div class="scanty-card" style="padding:18px">
        <h2 class="section-head">Order</h2>
        <div id="cartLines" style="min-height:60px"></div>
        <div class="totals">
          <div class="r-line"><span>Subtotal</span><span>₵<span id="subtotal">0.00</span></span></div>
          <div class="r-line" style="font-weight:800;font-size:16px"><span>Total</span><span>₵<span id="total">0.00</span></span></div>
        </div>
        <div style="margin-top:16px">
          <label class="scanty-label" for="custName">Customer name</label>
          <input class="scanty-input" id="custName" placeholder="Walk-in customer (optional)">
        </div>
        <div style="margin-top:12px">
          <label class="scanty-label" for="custPhone">Customer phone</label>
          <input class="scanty-input" id="custPhone" type="tel" placeholder="Optional">
        </div>
        <button class="scanty-btn scanty-btn--primary" style="width:100%;margin-top:18px;padding:14px" id="completeBtn" onclick="completeSale()">Complete Cash Sale</button>
        <div id="saleStatus" style="margin-top:12px;font-size:13px"></div>
      </div>
    </div>
  </div>

  <!-- ===== SALES VIEW ===== -->
  <div id="salesView" class="view">
    <h2 class="section-head">My Sales</h2>
    <div id="salesList">Loading…</div>
  </div>

</main>

<!-- Receipt -->
<div id="receiptModal">
  <div id="receipt">
    <div class="r-head">
      <div style="font-family:'Playfair Display',serif;font-weight:800;font-size:20px;color:#641D28">ScantyMeals</div>
      <div style="font-size:12px;color:#6b6460">Mpasatia Junction, Kumasi</div>
      <div style="font-size:12px;color:#6b6460">0242292939</div>
    </div>
    <div id="receiptBody"></div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="scanty-btn scanty-btn--secondary" style="flex:1" onclick="window.print()">Print receipt</button>
      <button class="scanty-btn scanty-btn--ghost" style="flex:1" onclick="closeReceipt()">Close</button>
    </div>
  </div>
</div>

<script>
  const API_BASE = (location.hostname.endsWith('onrender.com') || location.hostname === 'localhost')
    ? '' : 'https://scantymeals-shop-1.onrender.com';

  const TOKEN_KEY = 'token';
  const USER_KEY = 'user';

  let currentUser = null;
  let menu = [];
  let cart = {};   // { id: {id,name,price,image,quantity} }

  function getToken() { return localStorage.getItem(TOKEN_KEY) || sessionStorage.getItem(TOKEN_KEY); }
  function logout() { localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(USER_KEY); window.location.href = '/staff-login'; }
  function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function money(n) { return Number(n || 0).toFixed(2); }

  function showView(v) {
    document.getElementById('posView').classList.toggle('active', v === 'pos');
    document.getElementById('salesView').classList.toggle('active', v === 'sales');
  }

  async function api(path, opts = {}) {
    const headers = { ...(opts.headers || {}) };
    if (opts.body) headers['Content-Type'] = 'application/json';
    headers['Authorization'] = 'Bearer ' + getToken();
    return fetch(API_BASE + path, { ...opts, headers });
  }

  async function loadProfile() {
    const res = await api('/api/auth/profile');
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.success) { window.location.href = '/staff-login'; return; }
    currentUser = data.user || {};
    const allowed = ['staff', 'admin', 'super_admin'];
    if (!allowed.includes(currentUser.role)) { window.location.href = '/staff-login'; return; }
    document.getElementById('roleBadge').textContent = (currentUser.role || 'staff').replace('_', ' ');
  }

  async function loadMenu() {
    const grid = document.getElementById('mealGrid');
    try {
      const res = await fetch(API_BASE + '/api/menu');
      const data = await res.json();
      menu = data.items || [];
      if (!menu.length) { grid.innerHTML = '<div style="color:#6b6460">No menu items available.</div>'; return; }
      grid.innerHTML = menu.map(m => `
        <button class="meal-tile" onclick="addToCart('${esc(m.id)}')">
          <img src="${esc(m.image || '/IMG/menu_1.jpg')}" alt="${esc(m.name)}">
          <div class="tile-body">
            <div class="tile-name">${esc(m.name)}</div>
            <div class="tile-price">₵${money(m.price)}</div>
          </div>
        </button>`).join('');
    } catch (e) {
      grid.innerHTML = '<div style="color:#b3261e">Unable to load menu.</div>';
    }
  }

  function addToCart(id) {
    const m = menu.find(x => String(x.id) === String(id));
    if (!m) return;
    if (m.available === false) return;
    const existing = cart[String(id)];
    cart[String(id)] = { id: m.id, name: m.name, price: Number(m.price) || 0, image: m.image, quantity: (existing ? existing.quantity : 0) + 1 };
    renderCart();
  }
  function decQty(id) {
    const it = cart[String(id)];
    if (!it) return;
    if (it.quantity <= 1) delete cart[String(id)];
    else it.quantity -= 1;
    renderCart();
  }
  function incQty(id) { addToCart(id); }
  function removeLine(id) { delete cart[String(id)]; renderCart(); }

  function cartLines() { return Object.values(cart).filter(i => i && i.quantity > 0); }

  function renderCart() {
    const lines = cartLines();
    const el = document.getElementById('cartLines');
    const subtotal = lines.reduce((s, i) => s + i.price * i.quantity, 0);
    document.getElementById('subtotal').textContent = money(subtotal);
    document.getElementById('total').textContent = money(subtotal);
    document.getElementById('completeBtn').disabled = lines.length === 0;

    if (!lines.length) {
      el.innerHTML = '<div style="color:#6b6460;padding:16px 0">Cart is empty — tap a meal to add it.</div>';
      return;
    }
    el.innerHTML = lines.map(i => `
      <div class="cart-line">
        <div style="flex:1;min-width:0">
          <div style="font-weight:600;color:#292522">${esc(i.name)}</div>
          <div style="font-size:12px;color:#6b6460">₵${money(i.price)} each</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <button class="qty-btn" onclick="decQty('${esc(i.id)}')">−</button>
          <span style="min-width:22px;text-align:center;font-weight:600">${i.quantity}</span>
          <button class="qty-btn" onclick="incQty('${esc(i.id)}')">+</button>
        </div>
        <div style="font-weight:700;color:#39845B;min-width:64px;text-align:right">₵${money(i.price * i.quantity)}</div>
        <button class="qty-btn" style="color:#b3261e;border:none" onclick="removeLine('${esc(i.id)}')">✕</button>
      </div>`).join('');
  }

  async function completeSale() {
    const lines = cartLines();
    if (!lines.length) return;
    const statusEl = document.getElementById('saleStatus');
    statusEl.textContent = 'Recording sale…';
    const idempotencyKey = (crypto.randomUUID) ? crypto.randomUUID() : ('pos-' + Date.now() + '-' + Math.random().toString(16).slice(2));

    const payload = {
      items: lines.map(i => ({ id: i.id, quantity: i.quantity })),
      customer_name: document.getElementById('custName').value.trim(),
      customer_phone: document.getElementById('custPhone').value.trim(),
      payment_method: 'cash',
      idempotency_key: idempotencyKey,
    };

    try {
      const res = await api('/api/pos/sale', { method: 'POST', body: JSON.stringify(payload) });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        statusEl.innerHTML = '<div style="color:#b3261e">' + esc(data.message || 'Sale failed') + '</div>';
        return;
      }
      cart = {};
      document.getElementById('custName').value = '';
      document.getElementById('custPhone').value = '';
      renderCart();
      statusEl.innerHTML = '<div style="color:#2C6A48">Sale recorded: ' + esc(data.order.id) + '</div>';
      showReceipt(data.order);
    } catch (e) {
      statusEl.innerHTML = '<div style="color:#b3261e">Network error.</div>';
    }
  }

  function showReceipt(order) {
    const body = document.getElementById('receiptBody');
    const lines = (order.items || []).map(it => `
      <div class="r-line"><span>${esc(it.name)} × ${it.quantity}</span><span>₵${money(it.line_total ?? it.unit_price * it.quantity)}</span></div>`).join('');
    body.innerHTML = `
      <div class="r-line"><span>Order</span><span>${esc(order.id)}</span></div>
      <div class="r-line"><span>Date</span><span>${esc(new Date(order.timestamp).toLocaleString())}</span></div>
      <div class="r-line"><span>Customer</span><span>${esc(order.customer_name || '—')}</span></div>
      <div class="r-line"><span>Served by</span><span>${esc(order.created_by_name || order.created_by_username || '—')}</span></div>
      <div style="border-top:1px dashed #ddd;margin:8px 0"></div>
      ${lines}
      <div class="r-total"><span>Total</span><span>₵${money(order.total)}</span></div>
      <div class="r-line" style="margin-top:8px;color:#6b6460"><span>Payment</span><span>${esc((order.payment_method || 'cash').toUpperCase())} · PAID</span></div>
    `;
    document.getElementById('receiptModal').classList.add('open');
  }
  function closeReceipt() { document.getElementById('receiptModal').classList.remove('open'); }

  async function loadMySales() {
    const el = document.getElementById('salesList');
    el.innerHTML = 'Loading…';
    try {
      const res = await api('/api/pos/my-sales');
      const data = await res.json().catch(() => ({}));
      if (!res.ok) { el.innerHTML = '<div style="color:#b3261e">Unable to load sales.</div>'; return; }
      const sales = data.sales || [];
      if (!sales.length) { el.innerHTML = '<div style="color:#6b6460">No sales recorded yet.</div>'; return; }
      el.innerHTML = '<table class="scanty-table"><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Source</th><th>Total</th><th>Time</th></tr></thead><tbody>' +
        sales.map(s => `<tr>
          <td>${esc(s.id)}</td>
          <td>${esc(s.customer_name || '—')}</td>
          <td>${esc((s.items || []).map(i => i.name + ' ×' + i.quantity).join(', '))}</td>
          <td><span class="scanty-badge scanty-badge--role">${esc(s.source || 'STAFF')}</span></td>
          <td>₵${money(s.total)}</td>
          <td>${esc(new Date(s.timestamp).toLocaleString())}</td>
        </tr>`).join('') + '</tbody></table>';
    } catch (e) {
      el.innerHTML = '<div style="color:#b3261e">Unable to load sales.</div>';
    }
  }

  (async function init() {
    await loadProfile();
    loadMenu();
    renderCart();
  })();
</script>
</body>
</html>
